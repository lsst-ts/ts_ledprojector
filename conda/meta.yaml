{% set data= load_setup_py_data() %}
package:
  name: ts-ledprojector
  version: {{ data.get('version') }}

source:
  path: ../

build:
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .
  string: "py{{ PY_VER | replace('.', '') }}{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"
  entry_points:
    - run_ledprojector = lsst.ts.ledprojector:run_ledprojector

test:
  requires:
    - ts-conda-build =0.5
    - ts-xml {{ xml_version }}
    - ts-salobj {{ salobj_version }}
  source_files:
    - pyproject.toml
    - python
    - tests
  commands:
    - pytest

requirements:
  host:
    - python {{ python }}
    - pip
    - setuptools_scm ={{setuptools_scm}}
    - setuptools >={{setuptools}}
  run:
    - python {{ python }}
    - ts-xml
    - ts-salobj
    - ts-utils
    - ts-ess-common
    - ts-ess-labjack
    - labjack-ljm
    - libusb
